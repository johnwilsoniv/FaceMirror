name: Build S3 Intel

on:
  workflow_dispatch:
    inputs:
      sign_and_notarize:
        description: 'Sign and notarize the app'
        required: false
        default: false
        type: boolean

jobs:
  build:
    name: Build S3 Intel Mac
    runs-on: macos-15-intel  # Intel Mac runner

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        working-directory: "S3 Data Analysis"
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          # Install requirements but skip shap/fasttreeshap (excluded in spec, need llvmlite/LLVM)
          grep -v -E '^(shap|fasttreeshap)' requirements.txt > requirements_ci.txt
          pip install -r requirements_ci.txt
          # Install PyObjC for macOS app support
          pip install pyobjc-core pyobjc-framework-Cocoa

      - name: Build with PyInstaller
        working-directory: "S3 Data Analysis"
        run: |
          pyinstaller Paralysis_Analyzer_Intel.spec --noconfirm

      - name: Test app launches successfully
        working-directory: "S3 Data Analysis"
        run: |
          echo "=== Starting app launch test ==="

          # Launch the app in background
          open "dist/S3 Data Analysis.app" &

          # Wait for app to start
          sleep 10

          # Check if process is running
          if pgrep -f "S3 Data Analysis" > /dev/null; then
            echo "✅ App process is running"
          else
            echo "❌ App process not found - may have crashed"
            # Check for crash logs
            ls -la ~/Library/Logs/DiagnosticReports/ 2>/dev/null | head -5 || true
            exit 1
          fi

          # Wait a bit more for UI to fully render
          sleep 5

          # Take screenshot as proof
          screencapture -x screenshot_test.png
          echo "✅ Screenshot captured"

          # Verify screenshot was created and has content
          if [ -f screenshot_test.png ] && [ -s screenshot_test.png ]; then
            echo "✅ Screenshot saved successfully"
            ls -la screenshot_test.png
          else
            echo "⚠️ Screenshot may not have captured correctly"
          fi

          # Kill the app
          pkill -f "S3 Data Analysis" || true
          echo "=== App launch test complete ==="

      - name: Upload test screenshot
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: S3-Intel-Launch-Screenshot
          path: "S3 Data Analysis/screenshot_test.png"

      - name: Sign and Notarize
        if: ${{ inputs.sign_and_notarize }}
        working-directory: "S3 Data Analysis"
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          # Import certificate
          echo "$APPLE_CERTIFICATE" | base64 --decode > certificate.p12
          security create-keychain -p "" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "" build.keychain
          security import certificate.p12 -k build.keychain -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "" build.keychain

          # Sign the app
          /usr/bin/codesign --force --deep --sign "Developer ID Application: Your Name ($APPLE_TEAM_ID)" \
            --options runtime \
            --entitlements ../entitlements.plist \
            "dist/S3 Data Analysis.app"

          # Create DMG
          hdiutil create -volname "S3 Data Analysis" -srcfolder "dist/S3 Data Analysis.app" \
            -ov -format UDZO "FaceMirror-1.0.1-S3-Intel.dmg"

          # Sign DMG
          /usr/bin/codesign --force --sign "Developer ID Application: Your Name ($APPLE_TEAM_ID)" \
            "FaceMirror-1.0.1-S3-Intel.dmg"

          # Notarize
          xcrun notarytool submit "FaceMirror-1.0.1-S3-Intel.dmg" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait

          # Staple
          xcrun stapler staple "FaceMirror-1.0.1-S3-Intel.dmg"

      - name: Create unsigned DMG
        if: ${{ !inputs.sign_and_notarize }}
        working-directory: "S3 Data Analysis"
        run: |
          hdiutil create -volname "S3 Data Analysis" -srcfolder "dist/S3 Data Analysis.app" \
            -ov -format UDZO "FaceMirror-1.0.1-S3-Intel-unsigned.dmg"

      - name: Upload App Bundle
        uses: actions/upload-artifact@v4
        with:
          name: S3-Data-Analysis-Intel-App
          path: "S3 Data Analysis/dist/S3 Data Analysis.app"

      - name: Upload DMG (signed)
        if: ${{ inputs.sign_and_notarize }}
        uses: actions/upload-artifact@v4
        with:
          name: S3-Data-Analysis-Intel-DMG
          path: "S3 Data Analysis/FaceMirror-1.0.1-S3-Intel.dmg"

      - name: Upload DMG (unsigned)
        if: ${{ !inputs.sign_and_notarize }}
        uses: actions/upload-artifact@v4
        with:
          name: S3-Data-Analysis-Intel-DMG-unsigned
          path: "S3 Data Analysis/FaceMirror-1.0.1-S3-Intel-unsigned.dmg"
