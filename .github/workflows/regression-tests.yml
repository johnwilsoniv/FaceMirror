name: Regression Tests

# Runs the determinism / saved-model-load / eval-metrics gates that don't
# require the local canary video corpus. The full canary suite (tiers 1+2)
# requires data on the developer machine and runs locally via `make test`.

on:
  push:
    branches: [ main, 'feature/**' ]
    paths:
      - 'S3 Data Analysis/**'
      - 'pyfaceau/**'
      - 'pyclnf/**'
      - 'pyfhog/**'
      - 'pymtcnn/**'
      - 'requirements.lock'
      - '.github/workflows/regression-tests.yml'
  pull_request:
    branches: [ main ]
  schedule:
    # Mondays 06:00 UTC — weekly regression sentinel
    - cron: '0 6 * * 1'
  workflow_dispatch:

jobs:
  saved-model-eval:
    name: Saved-model regression vs paper snapshot
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.lock') }}

      # The lockfile pins pyfhog/pymtcnn to git SHAs that may be UNPUSHED.
      # Fall back to PyPI versions if those URLs 404 — install the rest verbatim.
      - name: Install Python deps (best-effort lockfile)
        run: |
          python -m pip install --upgrade pip
          # Skip lines pointing at potentially-unpushed git SHAs
          grep -vE '^-e git\+https://github.com/johnwilsoniv/(pyfhog|pymtcnn)' requirements.lock > /tmp/req.txt || true
          python -m pip install -r /tmp/req.txt || echo "::warning::Lockfile install partial — see logs"
          # Install the local-package SHAs from PyPI as fallback
          python -m pip install pyfhog pymtcnn || echo "::warning::pyfhog/pymtcnn not on PyPI — eval-metrics test will skip"

      - name: Pytest collection sanity (catches import errors anywhere)
        working-directory: "S3 Data Analysis"
        env:
          PYTHONHASHSEED: '42'
          OMP_NUM_THREADS: '1'
        run: |
          python -m pytest tests/ --collect-only -q || true

      - name: Re-evaluate saved models on paper_combined_results.csv
        working-directory: "S3 Data Analysis"
        env:
          PYTHONHASHSEED: '42'
          OMP_NUM_THREADS: '1'
        run: |
          # Compares saved models' test-set acc/F1 against the values frozen
          # in {zone}_face_eval_metrics.json. Fails if anything regresses.
          python - <<'PY'
          import json, sys
          from pathlib import Path
          sys.path.insert(0, '.')
          import sklearn; sklearn.set_config(enable_metadata_routing=True)
          import joblib, numpy as np, pandas as pd
          from sklearn.model_selection import train_test_split
          from sklearn.metrics import accuracy_score, f1_score
          import paralysis_training_helpers
          from paralysis_config import ZONE_CONFIG, INPUT_FILES
          from paralysis_utils import prepare_data_generalized, PARALYSIS_MAP

          PAPER = 'paper_combined_results.csv'
          MODEL_DIR = Path('models')
          TOL = 0.005  # 0.5 percentage point tolerance
          failures = []
          for zone in ['upper', 'mid', 'lower']:
              ref_path = MODEL_DIR / f'{zone}_face_eval_metrics.json'
              if not ref_path.exists():
                  print(f'::warning::{ref_path} missing — skipping {zone}'); continue
              ref = json.loads(ref_path.read_text())
              expected = ref['evaluation']['on_paper_combined_results']
              # Reproduce the exact eval
              model = joblib.load(MODEL_DIR / f'{zone}_face_model.pkl')
              scaler = joblib.load(MODEL_DIR / f'{zone}_face_scaler.pkl')
              with open(MODEL_DIR / f'{zone}_face_features.list') as f:
                  feats = [l.strip() for l in f if l.strip()]
              df, y, meta = prepare_data_generalized(
                  zone_key=zone, results_file_path=PAPER,
                  expert_file_path=INPUT_FILES['expert_key_csv'],
                  base_config_dict=ZONE_CONFIG, input_files_global_dict=INPUT_FILES,
                  class_names_global_dict=PARALYSIS_MAP)
              if df is None: print(f'::error::{zone}: prepare_data returned None'); failures.append(zone); continue
              cfg = ZONE_CONFIG[zone].get('training', {})
              meta = meta if meta is not None else pd.DataFrame(index=df.index)
              _, X_te, _, y_te, _, _ = train_test_split(df, y, meta, test_size=cfg.get('test_size', 0.25),
                                                       random_state=cfg.get('random_state', 42), stratify=y)
              y_pred = model.predict(scaler.transform(X_te[feats]))
              acc = accuracy_score(y_te, y_pred); f1w = f1_score(y_te, y_pred, average='weighted', zero_division=0)
              dacc = acc - expected['accuracy']; df1 = f1w - expected['f1_weighted']
              status = 'OK' if abs(dacc) <= TOL and abs(df1) <= TOL else 'FAIL'
              print(f'{zone:6s} acc={acc:.3f} (Δ{dacc:+.3f})  f1w={f1w:.3f} (Δ{df1:+.3f})  [{status}]')
              if status == 'FAIL': failures.append(zone)
          if failures: print(f'::error::Regression on: {failures}'); sys.exit(1)
          print('All zones within tolerance.')
          PY

  determinism-gate:
    name: Tier 0 determinism (graceful skip if no canary corpus)
    runs-on: ubuntu-latest
    continue-on-error: true  # Most tier0 tests need local canary corpus → skip is expected in CI
    steps:
      - uses: actions/checkout@v4
        with: { lfs: true }
      - uses: actions/setup-python@v5
        with: { python-version: '3.10' }
      - name: Install minimal deps
        run: |
          python -m pip install --upgrade pip pytest pyyaml pandas numpy scikit-learn xgboost joblib
      - name: Run tier0 (skips canary-dependent tests)
        working-directory: "S3 Data Analysis"
        env:
          PYTHONHASHSEED: '42'
          OMP_NUM_THREADS: '1'
        run: python -m pytest tests/ -m tier0 -ra --tb=short
