_meta:
  calibration_relaxations:
    agreement_subtract: 0.05
    feature_diff_add: 0.1
    mae_add: 0.1
    max_features_above_warning_add: 2
    pearson_r_subtract: 0.05
  policy: "Initial bands auto-calibrated from current goldens (worst observed value\
    \ + headroom). Updated whenever update_goldens.py --stage metric_bands runs. The\
    \ framework catches FUTURE drift below today's level. Tightening toward the manuscript-era\
    \ gold standard is a deliberate separate task \u2014 see RETRAINING_REPRODUCIBILITY.md."
stage1_bbox:
  _status: "placeholder \u2014 sub-PR 2 will calibrate after pyfaceau bbox capture"
  normal:
    median_center_diff_max_px: 5.0
    median_iou_min: 0.85
    success_rate_min: 0.99
  paralyzed:
    median_center_diff_max_px: 7.0
    median_iou_min: 0.8
    success_rate_min: 0.95
stage2_landmarks:
