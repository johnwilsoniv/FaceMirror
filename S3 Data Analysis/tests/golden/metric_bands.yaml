  policy: "Initial bands auto-calibrated from current goldens (worst observed value\
    \ + headroom). Updated whenever update_goldens.py --stage metric_bands runs. The\
    \ framework catches FUTURE drift below today's level. Tightening toward the manuscript-era\
    \ gold standard is a deliberate separate task \u2014 see RETRAINING_REPRODUCIBILITY.md."
