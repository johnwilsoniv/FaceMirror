# Canary patients for the SplitFace pipeline regression-test framework.
#
# Selection criteria:
#   - L+R mirrored video at S1O Processed Files/Face Mirror 1.0 Output
#   - L+R C++ AU CSVs at S2O Coded Files OF
#   - Standardized expert label in FPRS FP Key.csv
#   - Distributed across severity (Normal / Mid Partial / Mid Complete) and
#     across at-least-one-zone-affected vs all-zones-affected presentations.
#
# Schema:
#   id:        Patient ID matching all asset filenames
#   severity:  highest Mid Face label across L+R sides ("Normal" | "Partial" | "Complete")
#   labels:    standardized expert labels for all 6 zone-side cells
#   tier0:     true if used in the fast (Tier 0) determinism gate
#   role:      free-form description of why this patient was picked
#   in_gold_cpp_reference: true if rich C++ reference (with landmarks/HOG)
#                          already lives in gold_cpp_reference/ — those don't
#                          need a re-run; otherwise the AU-only CSV in
#                          S2O Coded Files OF is used.
#
# IMPORTANT: do not re-order or re-id without updating golden/test_split_seed42.json
# and golden/predictions_*.json — they reference patients by id.

canaries:
  - id: IMG_0422
    severity: Normal
    labels:
      upper_left: Normal
      upper_right: Normal
      mid_left: Normal
      mid_right: Normal
      lower_left: Normal
      lower_right: Normal
    tier0: false
    in_gold_cpp_reference: true
    role: Normal canary (bearded male; long-standing pyfaceau test video)

  - id: IMG_0942
    severity: Normal
