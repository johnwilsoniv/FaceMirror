[pytest]
# SplitFace pipeline regression-test suite
#
# Three tiers, separated by markers so CI / local runs can pick:
#   pytest -m tier0           # ≤30s; deterministic invariants only
#   pytest -m tier1           # ≤10min; full quality vs C++ on 10 canaries
#   pytest -m tier2           # ≤15min; retrain reproducibility (release gate)
#   pytest -m "tier0 or tier1"  # combined under-budget run

minversion = 7.0
addopts = -ra --strict-markers --tb=short
testpaths = .

markers =
    tier0: deterministic invariants — must pass on every commit, run in seconds
    tier1: full quality vs C++ gold — paralyzed/normal canaries, run in minutes
    tier2: retrain reproducibility / release gate — slowest, run before tagging
    requires_video: needs S1O Processed Files MP4s on local filesystem
    requires_cpp_csv: needs S2O Coded Files OF CSVs on local filesystem
    requires_jan1_model: needs the saved Jan 1 manuscript model
    slow: takes more than 60 seconds (nice-to-have filter)

# Treat any unmarked tests as a hard error so we don't accidentally orphan
# tests off the tier ladder.
filterwarnings =
    ignore::DeprecationWarning
    ignore::FutureWarning
    ignore::UserWarning:sklearn.*
    ignore::UserWarning:xgboost.*
